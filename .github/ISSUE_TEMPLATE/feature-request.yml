name: 💡 Feature request
description: A missing option, endpoint or site feature.
title: '[FEATURE] Short description'
labels: ['feature request']
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Builder site
        - API (/icons, /api/icons, /api/svgs)
        - skill-icon CLI or build scripts
        - Docs or readme
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The option, endpoint or behavior you have in mind.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I can open a pull request for it.
