name: 🚀 Add an icon
description: Suggest a new icon to be added to the list.
title: '[NEW ICON] Skill Name'
labels: ['icon suggestion']
body:
  - type: input
    id: skill-name
    attributes:
      label: Name
      description: The official spelling of the brand, with its spaces, casing and symbols. It is what the site displays.
      placeholder: 'Visual Studio Code, Next.js, shadcn/ui'
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - language
        - frontend
        - backend
        - database
        - cloud
        - devops
        - tooling
        - testing
        - observability
        - auth
        - ide
        - ai
        - design
        - game
        - payments
        - os
        - social
        - productivity
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official logo source
      description: A link to the brand's logo, press kit or brand guidelines page.
      placeholder: 'https://example.com/brand'
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why
      description: Why it belongs in the project. Feel free to suggest more than one icon.
      placeholder: "It's popular for web development..."
    validations:
      required: true
  - type: textarea
    id: reference-image
    attributes:
      label: Reference image
      description: The logo as an SVG, if you have it. Drag and drop the file here.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing icons and issues, and it is not there yet.
          required: true
        - label: I can open a pull request adding it.
