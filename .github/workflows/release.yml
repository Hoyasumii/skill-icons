name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# Never cancel an in-flight npm publish. Each main run checks the latest main.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Publish to npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'main' }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted publishing uses OIDC, without a NODE_AUTH_TOKEN placeholder.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Prepare version and changelog
        id: release
        run: bun run release:lib "$RUNNER_TEMP/release-notes.md"
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - if: steps.release.outputs.skip != 'true'
        run: bun run typecheck
      - if: steps.release.outputs.skip != 'true'
        run: bun run test
      - if: steps.release.outputs.skip != 'true'
        run: bun run typecheck:lib
      - if: steps.release.outputs.skip != 'true'
        run: bun run test:lib
      - if: steps.release.outputs.skip != 'true'
        run: bun run build:lib
      - name: Record release version and tag
        if: steps.release.outputs.skip != 'true' && !startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.release.outputs.version }}
          HUSKY: '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json packages/skill-icons/package.json bun.lock CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v$VERSION"
          fi
          if ! git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            git tag "v$VERSION"
          fi
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"
      - name: Publish
        if: steps.release.outputs.skip != 'true'
        working-directory: packages/skill-icons
        run: npm publish --ignore-scripts --loglevel verbose
      # GITHUB_TOKEN pushes do not start another workflow; publish happens above.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTES: ${{ steps.release.outputs.notes }}
        run: |
          if ! gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release create "v$VERSION" --verify-tag --notes-file "$NOTES" --title "v$VERSION"
          fi
